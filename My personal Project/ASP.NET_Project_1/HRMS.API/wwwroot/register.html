<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retailer Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --green: #25D366;
            --green-dark: #128C7E;
            --green-light: #dcfce7;
            --bg: #0a0f0d;
            --surface: #111a15;
            --border: #1e3028;
            --text: #e8f5e9;
            --muted: #6b8f76;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            overflow-x: hidden;
        }

            /* Background grid */
            body::before {
                content: '';
                position: fixed;
                inset: 0;
                background-image: linear-gradient(rgba(37,211,102,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(37,211,102,0.03) 1px, transparent 1px);
                background-size: 40px 40px;
                pointer-events: none;
                z-index: 0;
            }

            /* Glow blob */
            body::after {
                content: '';
                position: fixed;
                top: -20%;
                right: -10%;
                width: 600px;
                height: 600px;
                background: radial-gradient(circle, rgba(37,211,102,0.08) 0%, transparent 70%);
                pointer-events: none;
                z-index: 0;
            }

        .card {
            position: relative;
            z-index: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 0 60px rgba(37,211,102,0.05), 0 20px 60px rgba(0,0,0,0.4);
            animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .whatsapp-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 2rem;
        }

        .whatsapp-icon {
            width: 48px;
            height: 48px;
            background: var(--green);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
            box-shadow: 0 0 20px rgba(37,211,102,0.3);
        }

        .badge-text {
            font-family: 'Syne', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--green);
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #e8f5e9 0%, var(--green) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }

        .phone-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(37,211,102,0.1);
            border: 1px solid rgba(37,211,102,0.2);
            color: var(--green);
            font-size: 0.8rem;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 100px;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
            animation: fadeIn 0.5s ease both;
        }

            .form-group:nth-child(1) {
                animation-delay: 0.1s;
            }

            .form-group:nth-child(2) {
                animation-delay: 0.2s;
            }

            .form-group:nth-child(3) {
                animation-delay: 0.3s;
            }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--muted);
            margin-bottom: 0.5rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.875rem 1rem;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            outline: none;
        }

            input[type="text"]:focus {
                border-color: var(--green);
                background: rgba(37,211,102,0.05);
                box-shadow: 0 0 0 3px rgba(37,211,102,0.1);
            }

            input[type="text"]::placeholder {
                color: #2d4d38;
            }

        .submit-btn {
            width: 100%;
            margin-top: 2rem;
            padding: 1rem;
            background: var(--green);
            color: #0a0f0d;
            font-family: 'Syne', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
            letter-spacing: 0.02em;
            position: relative;
            overflow: hidden;
        }

            .submit-btn::before {
                content: '';
                position: absolute;
                inset: 0;
                background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 60%);
                pointer-events: none;
            }

            .submit-btn:hover {
                background: #22c55e;
                transform: translateY(-1px);
                box-shadow: 0 8px 25px rgba(37,211,102,0.35);
            }

            .submit-btn:active {
                transform: translateY(0);
            }

            .submit-btn:disabled {
                opacity: 0.6;
                cursor: not-allowed;
                transform: none;
            }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 2rem 0;
        }

        .footer-note {
            text-align: center;
            font-size: 0.78rem;
            color: var(--muted);
        }

        /* Success state */
        .success-screen {
            display: none;
            text-align: center;
            padding: 1rem 0;
        }

        .success-icon {
            width: 72px;
            height: 72px;
            background: rgba(37,211,102,0.1);
            border: 2px solid var(--green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2rem;
            animation: pop 0.4s cubic-bezier(0.16,1,0.3,1);
        }

        @keyframes pop {
            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .success-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--green);
            margin-bottom: 0.5rem;
        }

        .success-msg {
            color: var(--muted);
            font-size: 0.9rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Form view -->
        <div id="formView">
            <div class="whatsapp-badge">
                <div class="whatsapp-icon">📦</div>
                <div class="badge-text">Retailer Portal</div>
            </div>

            <h1>Complete Your Registration</h1>
            <p class="subtitle">Fill in your shop details to start placing orders via WhatsApp.</p>

            <div class="phone-pill" id="phonePill">
                📱 Loading...
            </div>

            <form id="registerForm">
                <input type="hidden" name="Phone" id="phoneInput" />

                <div class="form-group">
                    <label for="shopName">Shop Name</label>
                    <input type="text" id="shopName" name="ShopName" placeholder="e.g. Al-Amin General Store" required />
                </div>

                <div class="form-group">
                    <label for="ownerName">Owner Name</label>
                    <input type="text" id="ownerName" name="OwnerName" placeholder="e.g. Mohammad Amin" required />
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" name="Address" placeholder="e.g. 12 Main Road, Dhaka" required />
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    Register My Shop →
                </button>
            </form>

            <div class="divider"></div>
            <p class="footer-note">Your data is secure and will only be used for order management.</p>
        </div>

        <!-- Success view -->
        <div class="success-screen" id="successView">
            <div class="success-icon">✓</div>
            <div class="success-title">You're Registered!</div>
            <p class="success-msg">Your shop has been successfully registered.<br />You can now place orders via WhatsApp. 🎉</p>
        </div>
    </div>

    <script>
  // Get phone from URL query param
  const params = new URLSearchParams(window.location.search);
  const phone = params.get('phone') || '';

  document.getElementById('phoneInput').value = phone;
  document.getElementById('phonePill').textContent = phone ? `📱 +${phone}` : '📱 Unknown number';

  document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Registering...';

    const data = {
      Phone: phone,
      ShopName: document.getElementById('shopName').value,
      OwnerName: document.getElementById('ownerName').value,
      Address: document.getElementById('address').value
    };

    try {
      const res = await fetch('/api/WhatsApp/register-retailer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      if (res.ok) {
        document.getElementById('formView').style.display = 'none';
        document.getElementById('successView').style.display = 'block';
      } else {
        btn.disabled = false;
        btn.textContent = 'Register My Shop →';
        alert('Registration failed. Please try again.');
      }
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Register My Shop →';
      alert('Network error. Please try again.');
    }
  });
    </script>

</body>
</html>
